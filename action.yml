name: Seqera Platform Launch
description: Launch and monitor a Nextflow pipeline run on Seqera Platform
author: Seqera

# The contract below is fixed by ADR 0005. Input names are kebab-case, which is
# a breaking change from action-tower-launch's snake_case.
inputs:
  access-token:
    description: Seqera Platform access token
    required: true
  api-endpoint:
    description: Seqera Platform API endpoint
    required: false
    default: https://api.cloud.seqera.io
  workspace-id:
    description: Seqera Platform workspace ID; defaults to the user workspace
    required: false

  # compute-env-id wins when both are set. Resolving a name costs a
  # ListComputeEnvs call, which has no name filter, so the match happens here.
  compute-env-id:
    description: Compute environment ID to launch into
    required: false
  compute-env:
    description: Compute environment name; ignored when compute-env-id is set
    required: false

  pipeline:
    description: Pipeline to launch
    required: false
    default: https://github.com/${{ github.repository }}
  revision:
    description: Pipeline revision, branch, tag, or commit
    required: false
  work-dir:
    description: Pipeline work directory
    required: false
  parameters:
    description: Pipeline parameters, as YAML or JSON
    required: false
  profiles:
    description: Nextflow config profiles, one per line or comma-separated
    required: false
  run-name:
    description: Name for the run
    required: false
  nextflow-config:
    description: Additional Nextflow configuration
    required: false
  pre-run-script:
    description: Script to run before the pipeline
    required: false

  # Added in v1; absent from action-tower-launch.
  post-run-script:
    description: Script to run after the pipeline
    required: false
  label-ids:
    description: Label IDs to attach to the run, one per line or comma-separated
    required: false
  output-dir:
    description: Pipeline output directory
    required: false
  stub-run:
    description: Run the pipeline in stub mode
    required: false
  pull-latest:
    description: Pull the latest pipeline revision before launching
    required: false
  nextflow-version:
    description: Nextflow version to use
    required: false
  syntax-parser:
    description: Nextflow syntax parser, v1 or v2; omit to use the default
    required: false
  head-job-cpus:
    description: CPUs for the Nextflow head job
    required: false
  head-job-memory-mb:
    description: Memory for the Nextflow head job, in MB
    required: false

  # ADR 0006: enum, not v2's boolean. `running` catches submit-time and
  # validation failures without holding a runner open for a whole pipeline.
  wait:
    description: How long to wait; one of running, completion, or none
    required: false
    default: running
  timeout:
    description: >-
      Max time to wait, e.g. 90m. Unset polls until the job's own time limit.
    required: false

# ADR 0005 drops action-tower-launch's `json` output so the response shape does
# not become a public contract. ADR 0006 adds status and error-message so
# callers can branch or build a PR comment without re-querying the API.
outputs:
  workflow-id:
    description: The ID of the launched workflow
  workflow-url:
    description: URL of the launched workflow in Seqera Platform
  workspace-id:
    description: The workspace the run was launched into
  workspace-ref:
    description: The workspace reference, as org/workspace
  status:
    description: Terminal workflow status, when waited for
  error-message:
    description: Failure message from the run, when it failed

runs:
  using: node24
  main: dist/index.js

# ADR 0007. Green per brand.seqera.net; v2's purple was off-brand.
branding:
  icon: play
  color: green

name: Seqera Platform Launch
description: Launch and monitor a Nextflow pipeline run on Seqera Platform
author: Seqera

# The contract below is fixed by ADR 0005. Input names are kebab-case, which is
# a breaking change from action-tower-launch's snake_case.
inputs:
  access-token:
    description: Seqera Platform access token
    required: true
  api-endpoint:
    description: Seqera Platform API endpoint
    required: false
    default: https://api.cloud.seqera.io
  workspace-id:
    description: Seqera Platform workspace ID; defaults to the user workspace
    required: false

  # compute-env-id wins when both are set. Resolving a name costs a
  # ListComputeEnvs call, which has no name filter, so the match happens here.
  compute-env-id:
    description: Compute environment ID to launch into
    required: false
  compute-env:
    description: Compute environment name; ignored when compute-env-id is set
    required: false

  pipeline:
    description: Pipeline to launch
    required: false
    default: https://github.com/${{ github.repository }}
  revision:
    description: Pipeline revision, branch, tag, or commit
    required: false
  work-dir:
    description: Pipeline work directory
    required: false
  parameters:
    description: Pipeline parameters as JSON or YAML; sent as paramsText
    required: false
  profiles:
    description: Comma-separated Nextflow config profiles
    required: false
  run-name:
    description: Name for the run
    required: false
  nextflow-config:
    description: Additional Nextflow config; sent as configText
    required: false
  pre-run-script:
    description: Script to run before the pipeline
    required: false

  # Added in v1; absent from action-tower-launch.
  post-run-script:
    description: Script to run after the pipeline
    required: false
  label-ids:
    description: Comma-separated label IDs to attach to the run
    required: false
  output-dir:
    description: Pipeline output directory
    required: false
  stub-run:
    description: Run the pipeline in stub mode
    required: false
  pull-latest:
    description: Pull the latest pipeline revision before launching
    required: false
  nextflow-version:
    description: Nextflow version to use
    required: false
  head-job-cpus:
    description: CPUs for the Nextflow head job
    required: false
  head-job-memory-mb:
    description: Memory in MB for the Nextflow head job
    required: false

  wait:
    description: Wait for the run to reach a terminal state
    required: false
    default: "false"

# ADR 0005 drops action-tower-launch's `json` output so the response shape does
# not become a public contract. Whether status and error-message join this set
# is issue #5's call.
outputs:
  workflow-id:
    description: The ID of the launched workflow
  workflow-url:
    description: URL of the launched workflow in Seqera Platform
  workspace-id:
    description: The workspace the run was launched into
  workspace-ref:
    description: The workspace reference, as org/workspace

runs:
  using: node24
  main: dist/index.js

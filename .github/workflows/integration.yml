# Dogfood the action against live Seqera Platform.
#
# Required repo secrets: SEQERA_ACCESS_TOKEN, SEQERA_WORKSPACE_ID, SEQERA_COMPUTE_ENV
# Optional secret: SEQERA_API_ENDPOINT
#
# No work-dir is passed on purpose: the action falls back to the compute
# environment's own work directory, which is the path most users hit.
#
# Skips fork PRs (no secrets) and forks of this repository.

name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Nextflow pipeline repository URL
        required: false
        default: https://github.com/nextflow-io/hello
        type: string
      compute-env:
        description: Compute environment name (optional)
        required: false
        type: string
      compute-env-id:
        description: Compute environment ID (optional; wins over name)
        required: false
        type: string
      workspace-id:
        description: Workspace ID (optional)
        required: false
        type: string
      api-endpoint:
        description: Seqera Platform API endpoint
        required: false
        default: https://api.cloud.seqera.io
        type: string

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launch:
    name: Launch on Seqera Platform
    if: >-
      github.repository == 'seqeralabs/action-seqera-launch' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Launch stub pipeline
        id: launch
        uses: ./
        with:
          access-token: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          api-endpoint: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.api-endpoint
            || secrets.SEQERA_API_ENDPOINT
            || 'https://api.cloud.seqera.io' }}
          pipeline: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.pipeline
            || 'https://github.com/nextflow-io/hello' }}
          stub-run: true
          wait: running
          compute-env: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.compute-env
            || secrets.SEQERA_COMPUTE_ENV }}
          compute-env-id: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.compute-env-id || '' }}
          workspace-id: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.workspace-id
            || secrets.SEQERA_WORKSPACE_ID }}

      - name: Assert launch outputs
        run: |
          test -n "${{ steps.launch.outputs.workflow-id }}"
          test -n "${{ steps.launch.outputs.workflow-url }}"
          test -n "${{ steps.launch.outputs.workspace-id }}"
          test -n "${{ steps.launch.outputs.workspace-ref }}"
          test -n "${{ steps.launch.outputs.status }}"

      - name: Reject invalid pipeline
        id: invalid_launch
        continue-on-error: true
        uses: ./
        with:
          access-token: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          api-endpoint: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.api-endpoint
            || secrets.SEQERA_API_ENDPOINT
            || 'https://api.cloud.seqera.io' }}
          pipeline: no_pipeline_exists
          stub-run: true
          wait: none
          # Must match the positive test, otherwise this step fails on a
          # missing compute environment instead of the invalid pipeline.
          compute-env: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.compute-env
            || secrets.SEQERA_COMPUTE_ENV }}
          workspace-id: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.workspace-id
            || secrets.SEQERA_WORKSPACE_ID }}

      - name: Check invalid pipeline failed
        env:
          OUTCOME: ${{ steps.invalid_launch.outcome }}
          WORKFLOW_ID: ${{ steps.invalid_launch.outputs.workflow-id }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected invalid pipeline launch to fail, got: $OUTCOME"
            exit 1
          fi
          if [ -n "$WORKFLOW_ID" ]; then
            echo "Expected no workflow to be launched, got: $WORKFLOW_ID"
            exit 1
          fi

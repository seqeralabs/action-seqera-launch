name: check-dist

# dist/index.js is committed because the Actions runtime executes it directly.
# This job fails when it is stale relative to src/.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Rebuild the bundle
        run: npm run build

      - name: Compare against the committed bundle
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi
          echo "dist/ is up to date."

      - name: Upload the expected bundle
        if: failure() && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expected-dist
          path: dist/

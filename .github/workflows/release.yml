name: release

# Triggered by pushing a SemVer tag. Builds, refuses to release a stale
# dist/, creates the Release, and moves the floating major tag. See
# docs/decisions/0007-release-and-versioning.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # A tag is not a pull request, so nothing else has necessarily gated this
      # commit. Re-run the same checks CI runs before publishing it.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:types
      - run: npm run typecheck
      - run: npm run test

      - name: Rebuild the bundle
        run: npm run build

      # The one failure that would ship broken code to every consumer at once.
      - name: Refuse to release a stale bundle
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ at this tag is stale. Rebuild, commit, and re-tag."
            git diff --stat dist/
            exit 1
          fi
          echo "dist/ matches src/."

      - name: Work out the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          major="${REF_NAME%%.*}"
          {
            echo "prerelease=$prerelease"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"
          echo "$REF_NAME: prerelease=$prerelease, major tag=$major"

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$REF_NAME" --generate-notes --prerelease --verify-tag
          else
            gh release create "$REF_NAME" --generate-notes --latest --verify-tag
          fi

      # Deliberately a bare git tag with no Release attached: immutable
      # releases freeze only tags that have one, and this tag must stay
      # movable. Pre-releases do not move it.
      - name: Move the floating major tag
        if: steps.version.outputs.prerelease == 'false'
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git tag --force "$MAJOR" "$SHA"
          git push --force origin "refs/tags/$MAJOR"
          echo "$MAJOR now points at $SHA ($REF_NAME)."
